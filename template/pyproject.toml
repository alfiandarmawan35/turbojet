[project]
name = "turbojet"
description = "Template SaaS Frappe: akun, paket, kuota, pekerjaan latar belakang, dan engine Python/Rust"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.pytest.ini_options]
testpaths = ["turbojet/engine/tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
